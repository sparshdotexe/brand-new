# monitor = name, resolution, position, scale

#monitor=,preferred,auto,auto

monitor = eDP-1,1920x1080@60,auto,1.25
monitor = HDMI-A-1,preferred,auto,auto,mirror,eDP-1

xwayland {
  force_zero_scaling = true
}

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
  gaps_in = 3
  gaps_out = 3
  border_size = 2

  col.active_border = rgba(000000ee)
  col.inactive_border = rgba(1e1e1eee)
  
  resize_on_border = false

  allow_tearing = false
  layout = dwindle
}


decoration {
  rounding = 0
  rounding_power = 2

  active_opacity = 1.0
  inactive_opacity = 1.0 #1.0

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }
   
  blur {
    enabled = true
    size = 2
    passes = 2
    special = true
    brightness = 0.60
    contrast = 0.75
  }
}

dwindle {
  pseudotile = true
  preserve_split = true
}

master {
  new_status = master
}

cursor {
  hide_on_key_press = true
  warp_on_change_workspace = 1
}

misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
}
